name: yandepderche_app
description: Yandepderçe - Oraz Çarýarowyň web sahypasy üçin ýeňil Android programma.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  min_sdk_android: 24
  adaptive_icon_background: "#0A5F58"
  adaptive_icon_foreground: assets/icon/foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
